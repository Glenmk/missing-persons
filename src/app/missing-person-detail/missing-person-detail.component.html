<div class="detail-container">
  @if (person(); as p) {
  <div class="detail-card">
    <img [src]="p.photoUrl" [alt]="p.name" class="detail-img" />
    <div class="detail-body">
      <h2 class="detail-title">{{ p.name }}</h2>
      <p class="detail-text">Age: {{ p.age }}</p>
      <p class="detail-text">Last Seen: {{ p.lastSeenLocation }}</p>
      <div class="button-group">
        <button class="btn btn-success" (click)="markAsFound()">
          Mark as Found
        </button>
        <button class="btn btn-secondary" (click)="goBack()">Back</button>
      </div>
    </div>
  </div>
  } @else {
  <p>Person not found.</p>
  }
</div>
