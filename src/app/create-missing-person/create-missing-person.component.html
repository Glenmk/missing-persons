<div class="form-container">
  <h2>Add a Missing Person</h2>
  <form (ngSubmit)="addPerson()">
    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        class="form-control"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
      />
    </div>
    <div class="form-group">
      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        class="form-control"
        [ngModel]="age()"
        (ngModelChange)="age.set($event)"
        name="age"
      />
    </div>
    <div class="form-group">
      <label for="lastSeenLocation">Last Seen Location</label>
      <input
        type="text"
        id="lastSeenLocation"
        class="form-control"
        [ngModel]="lastSeenLocation()"
        (ngModelChange)="lastSeenLocation.set($event)"
        name="lastSeenLocation"
      />
    </div>
    <div class="form-group">
      <label for="photoUrl">Photo URL</label>
      <input
        type="text"
        id="photoUrl"
        class="form-control"
        [ngModel]="photoUrl()"
        (ngModelChange)="photoUrl.set($event)"
        name="photoUrl"
      />
    </div>
    <div class="button-group">
      <button type="submit" class="btn btn-primary">Add Person</button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">
        Cancel
      </button>
    </div>
  </form>
</div>
